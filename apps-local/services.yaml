apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    # same app repo commit as prod, CI bumps both; local values layer on top of prod's
    - repoURL: https://github.com/vahan-sahakyan/distributed-social-network.git
      targetRevision: da6495b6a24fdf533fc8653806dee577acc1829d
      path: deploy/kubernetes/services
      helm:
        valueFiles:
          - $values/envs/prod/services-values.yaml
          - $values/envs/local/services-values.yaml
    - repoURL: https://github.com/vahan-sahakyan/distributed-social-network-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dsn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
