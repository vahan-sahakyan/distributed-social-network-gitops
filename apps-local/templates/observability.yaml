{{- if or .Values.obs .Values.tools }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  # switching obs and tools off deletes the app, and with it what it deployed
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    # local only for now; CI pins it to each main commit like the other apps
    - repoURL: https://github.com/vahan-sahakyan/distributed-social-network.git
      targetRevision: {{ .Values.appRevision }}
      path: deploy/kubernetes/observability
      helm:
        valueFiles:
          - $values/envs/local/observability-values.yaml
        valuesObject:
          stack: {enabled: {{ .Values.obs }}}
          redpandaConsole: {enabled: {{ .Values.tools }}}
          kibana: {enabled: {{ and .Values.tools .Values.search }}}
    - repoURL: https://github.com/vahan-sahakyan/distributed-social-network-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dsn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
