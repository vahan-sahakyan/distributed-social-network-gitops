image:
  # app repo commit, bumped by its publish workflow
  tag: 0885bdc48a2d93c7b2dc88c5e4fe07303fbb32f9
route:
  # bare public IP, no domain: https on any host with the self-signed dsn-tls secret the
  # node makes for its current IP at boot. With a domain: host, certificate: true, publicUrl
  host: ""
  tls: true
  certificate: false
# empty leaves the token issuer unchecked, since the IP changes on restart
publicUrl: ""
# one 2 vCPU node (AWS m7i-flex.large): the events group stays off
services:
  event-writer: {enabled: false}
  cache-rebuilder: {enabled: false}
