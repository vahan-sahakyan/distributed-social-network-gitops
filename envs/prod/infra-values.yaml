# credentials come from OpenBao through External Secrets
postgres:
  storage: 2Gi
scylla:
  storage: 5Gi
# the feed's event store: cache-rebuilder refills Valkey (1h TTL, no volume) from it.
# ClickHouse sizes itself from its memory limit; 1.5Gi keeps the 8 GB node clear
clickhouse:
  storage: 10Gi
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 1536Mi}
minio:
  storage: 20Gi
keycloak:
  # bare public IP that changes on restart: login redirects are relative, valid on any origin
  uiUrl: /
