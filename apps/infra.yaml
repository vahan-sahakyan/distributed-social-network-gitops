apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    # chart at the same app repo commit the images were built from; CI bumps both
    - repoURL: https://github.com/vahan-sahakyan/distributed-social-network.git
      targetRevision: 2416c1a8f7e9d2c27db5a4065761c10b2da22b57
      path: deploy/kubernetes/infra
      helm:
        valueFiles:
          - $values/envs/prod/infra-values.yaml
    - repoURL: https://github.com/vahan-sahakyan/distributed-social-network-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dsn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
