apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              # group and kind spelled out: the CRD defaults them, and a missing one is a permanent diff
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: dsn
                namespace: dsn
                sectionName: http
